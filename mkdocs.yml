site_name: Observatório de reservas FCTE · Trajetórias Acadêmicas
site_description: Plataforma de dados sobre as vagas reservadas pelas turmas da UnB aos cursos de engenharia da FCTE (BD2 / FCTE-UnB, Squad G2)
site_url: https://trajetorias-academicas-bd2-2026-2.github.io/documentation/
repo_url: https://github.com/Trajetorias-Academicas-BD2-2026-2/documentation
repo_name: Trajetorias-Academicas-BD2-2026-2/documentation
edit_uri: edit/main/docs/
copyright: Equipe Trajetórias Acadêmicas UnB — Sistemas de Banco de Dados 2 / FCTE-UnB, 2026.2

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: pt

exclude_docs: |
  **/*:Zone.Identifier

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Início: index.md
  - Projeto:
      - Visão geral: projeto/visao-geral.md
      - Arquitetura: projeto/arquitetura.md
  - Entregas:
      - "E1 · Fonte transacional": entregas/e1.md
      - "E2 · Ingestão e CDC": entregas/e2.md
      - "E3 · Camada analítica": entregas/e3.md
  - Dados:
      - Fonte e coleta: dados/fonte-e-coleta.md
      - Modelo OLTP: dados/modelo-oltp.md
      - Carga de trabalho: dados/carga-de-trabalho.md
      - Camada analítica: dados/camada-analitica.md
  - Pipeline:
      - Ingestão: pipeline/ingestao.md
      - Orquestração: pipeline/orquestracao.md
      - Qualidade e testes: pipeline/qualidade.md
      - Desempenho: pipeline/desempenho.md
  - Consumo:
      - Painel: consumo/painel.md
      - Governança: consumo/governanca.md
  - Decisões:
      - Índice de ADRs: decisoes/index.md
      - "ADR-0001: Modelagem inicial (substituído)": decisoes/0001-modelagem-fonte-origem.md
      - "ADR-0002: Extração por navegador (substituído)": decisoes/0002-extracao-via-navegador-real.md
      - "ADR-0003: Reservas e currículo versionado": decisoes/0003-reservas-por-curso-e-curriculo-versionado.md
      - "ADR-0004: Lote versionado": decisoes/0004-coleta-publica-versionada.md
      - "ADR-0005: Ingestão da E2": decisoes/0005-ingestao-e2.md
      - "ADR-0006: Camada analítica da E3": decisoes/0006-camada-analitica-observatorio-e3.md
  - Referência:
      - Diário de bordo: referencia/diario.md
      - Glossário: glossario.md
      - Como contribuir: como-contribuir.md
  - Apresentação: apresentacao.md
