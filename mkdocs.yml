site_name: Trajetórias Acadêmicas UnB
site_description: Documentação de engenharia de dados do projeto Trajetórias Acadêmicas UnB (BD2 / FCTE-UnB)
site_url: https://trajetorias-academicas-bd2-2026-2.github.io/documentation/
repo_url: https://github.com/Trajetorias-Academicas-BD2-2026-2/documentation
repo_name: Trajetorias-Academicas-BD2-2026-2/documentation
edit_uri: edit/main/docs/
copyright: Equipe Trajetórias Acadêmicas UnB — Sistemas de Banco de Dados 2 / FCTE-UnB, 2026.2

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: pt

exclude_docs: |
  **/*:Zone.Identifier

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Início: index.md
  - Projeto:
      - Visão geral: projeto/visao-geral.md
      - Perguntas e indicadores: projeto/indicadores.md
      - Arquitetura proposta: projeto/arquitetura.md
      - Plano de validação: projeto/plano-de-validacao.md
  - Dados:
      - Fontes de dados: dados/fontes.md
      - Integração Inep: dados/integracao-inep.md
      - Formatos de armazenamento: dados/formatos.md
      - Modelo de dados: dados/modelo-de-dados.md
      - Cargas e engines: dados/cargas-e-engines.md
  - Pipeline:
      - Visão geral: pipeline/visao-geral.md
      - Etapas: pipeline/etapas.md
      - E2 — Ingestão em lote e CDC: pipeline/ingestao-e2.md
      - Executar extensão Inep: pipeline/execucao-inep.md
      - Qualidade e reprocessamento: pipeline/qualidade.md
      - Riscos: pipeline/riscos.md
  - Decisões:
      - Índice de ADRs: decisoes/index.md
      - "ADR-001: PostgreSQL + Parquet": decisoes/adr-001-postgresql-parquet.md
      - "ADR-002: Integração Inep": decisoes/adr-002-integracao-inep.md
      - "ADR-003: Mecanismo de ingestão E2": decisoes/adr-003-ingestao-e2.md
  - Diário da E2: diario-e2.md
  - Referência:
      - Origem e rastreabilidade: referencia/planilha.md
      - Pendências: pendencias.md
      - Glossário: glossario.md
      - Como contribuir: como-contribuir.md
